appId: com.jeak.agent
productName: Jeak Agent
directories:
  buildResources: build
  output: dist

publish:
  provider: github
  owner: winjeakt
  repo: Jeak-Agent
  releaseType: release

files:
  - out/**/*
  - package.json

asar: true
npmRebuild: false

win:
  target:
    - target: nsis
      arch:
        - x64
  icon: build/icon.ico
  executableName: jeak-agent

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: Jeak Agent

mac:
  target:
    - target: dmg
      arch:
        - arm64
        - x64
  category: public.app-category.developer-tools
  icon: build/icon-512.png
  identity: null

linux:
  target:
    - target: AppImage
      arch:
        - x64
  category: Development
  maintainer: jeak
  icon: build/icon-512.png
