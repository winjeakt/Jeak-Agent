name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.platform }} (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
            command: npx electron-builder --win --publish always
          - os: macos-latest
            platform: mac
            command: npx electron-builder --mac --publish always
          - os: ubuntu-latest
            platform: linux
            command: npx electron-builder --linux --publish always
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build app (electron-vite)
        run: npm run build

      - name: Package & publish to GitHub Releases
        run: ${{ matrix.command }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 无代码签名证书时禁用自动发现，避免 CI 报错
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
