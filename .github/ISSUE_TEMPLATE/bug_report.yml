name: Bug 报告
description: 提交一个 Bug 报告，帮助我们改进 Jeak Agent
title: '[Bug] '
labels: ['bug']
body:
  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 清晰、简洁地描述 Bug 现象。
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 一步步说明如何稳定复现该问题。
      placeholder: |
        1. 打开 ...
        2. 点击 ...
        3. 观察到 ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望行为
      description: 你期望发生什么？
  - type: input
    id: version
    attributes:
      label: 环境信息
      description: 操作系统、Node 版本、Jeak Agent 版本等。
      placeholder: 例如 Windows 11 / Node 22 / Jeak Agent 0.2.1
  - type: textarea
    id: logs
    attributes:
      label: 日志 / 截图
      description: 粘贴相关终端日志或截图（可选，有助于定位）。
  - type: textarea
    id: context
    attributes:
      label: 补充说明
      description: 任何其他有助于排查的信息。
