name: 功能建议
description: 提出一个新功能或改进建议
title: '[Feature] '
labels: ['enhancement']
body:
  - type: textarea
    id: problem
    attributes:
      label: 背景与动机
      description: 这个功能要解决什么问题？描述具体使用场景。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 功能描述
      description: 清晰描述你期望的功能或行为。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案
      description: 你考虑过哪些替代方案？
  - type: textarea
    id: context
    attributes:
      label: 补充说明
      description: 其他需要说明的信息。
